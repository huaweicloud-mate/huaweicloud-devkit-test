name: daily-issue-triage

# 每日测试结果 → issue 分诊（测试侧完善 / 产品侧需求）的「分析 + 落盘」自动化。
#
# 只做确定性分析与待提单落盘（DRY-RUN），不开 issue；真正提单由维护者本地 `--live` 复核后执行
# （理由：① 产品仓提单前需人判断「KooCLI 服务覆盖/沙箱基建」等误标项；② CI 的 HDK_GH_TOKEN 权限
#  仅验证过 push，未验证 issues:write；③ 尊重「全量测完统一合并一张单 + 先落盘根因」红线）。
#
# 触发：
#   1. auto-summary（专项分析）完成后即刻分诊（workflow_run，根治「待提单早于专项分析」时序错位）
#   2. 每天 19:45 北京时间（schedule，兜底）
#   3. 手动 workflow_dispatch（可即时出一版）
on:
  workflow_run:
    workflows: [auto-summary]   # 专项分析(gen_special_report.py)落盘后立即重新分诊，保证读到当天最新「无单号清单」
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '45 11 * * *'    # UTC 11:45 = 北京时间 19:45

permissions:
  contents: write            # 写回 results/Summary/待提单-<日期>.md 需要

concurrency:
  group: daily-issue-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai      # 脚本用 datetime.now() 取日期，必须按北京时间
    steps:
      - name: Checkout 测试仓
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # push 回用 PAT（main 分支保护下 GITHUB_TOKEN 会被拒 GH006）

      - name: Checkout 源码仓 huaweicloud/huaweicloud-devkit
        uses: actions/checkout@v4
        with:
          repository: huaweicloud/huaweicloud-devkit
          ref: main
          path: hdk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行 issue 分诊（DRY-RUN 落盘待提单）
        env:
          HUAWEICLOUD_DEVKIT_HOME: ${{ github.workspace }}/hdk
        run: python scripts/daily_issue_triage.py --dry-run

      - name: Commit & push 待提单
        # 本仓写入者众多（多 agent 直推 + 其他自动写回），commit 与 push 之间 main 若有新提交，
        # 直接 push 会 non-fast-forward 被拒（见 #41）。故 push 前先 fetch + rebase 对齐远端，
        # 冲突则 abort 后重试，最多 3 次（参考 #33 refresh-dashboard 已验证的重试模式）。
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/Summary/待提单-*.md
          if git diff --cached --quiet; then
            echo "待提单无变动，跳过提交"
            exit 0
          fi
          git commit -m "chore: 每日 issue 分诊待提单 $(date +%Y-%m-%d)"
          REMOTE="https://shuangheaven:${{ secrets.HDK_GH_TOKEN }}@github.com/huaweicloud-mate/huaweicloud-devkit-test.git"
          for attempt in 1 2 3; do
            if ! git fetch "$REMOTE" main; then
              echo "fetch 失败（第 ${attempt} 次尝试）" >&2
            elif ! git rebase FETCH_HEAD; then
              echo "rebase 冲突，abort（第 ${attempt} 次尝试）" >&2
              git rebase --abort || true
            elif git push "$REMOTE" HEAD:main; then
              echo "推送成功（第 ${attempt} 次尝试）"
              exit 0
            else
              echo "push 被拒，远端又前进（第 ${attempt} 次尝试）" >&2
            fi
            sleep 5
          done
          echo "连续 3 次 fetch+rebase+push 失败，放弃" >&2
          exit 1