name: refresh-dashboard

# 触发时机：
#   1. auto-summary 成功生成汇总报告后自动触发（workflow_run，汇总更新即刷）
#   2. 每小时第 15 分钟（schedule，兜底）
#   3. 手动 workflow_dispatch
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'          # 每小时第 15 分钟（UTC）
  workflow_run:
    workflows: [auto-summary]     # 汇总报告更新后触发
    types: [completed]

concurrency:
  group: refresh-dashboard        # 单例，避免并发 push 冲突
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    # 仅当 auto-summary 成功完成才刷新；schedule/dispatch 触发时 workflow_run 事件为空，同样放行。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # UX 专项数据：跑 D11 体验夹具（三态），落 results/UX专项/UX专项-<日期>.json
      # 取版规则与每日测试同一真源（scripts/prepare_env.py::_version_key），避免第二套口径。
      - name: 选定被测包版本
        id: sut
        run: |
          set -euo pipefail
          VER=$(python scripts/pick_sut_version.py)
          echo "被测包版本: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 拉取被测包源码树（仓外，不污染工作区）
        continue-on-error: true
        run: |
          set -euo pipefail
          SUT_ROOT="${RUNNER_TEMP}/ux-sut"
          rm -rf "$SUT_ROOT" && mkdir -p "$SUT_ROOT"
          npm install --no-save --prefix "$SUT_ROOT" "huaweicloud-devkit@${{ steps.sut.outputs.version }}"
          test -f "$SUT_ROOT/node_modules/huaweicloud-devkit/plugins/huaweicloud-core/src/tools.mjs"

      - name: 生成 UX 专项数据（D11 体验夹具）
        continue-on-error: true
        run: |
          set -euo pipefail
          SRC="${RUNNER_TEMP}/ux-sut/node_modules/huaweicloud-devkit/plugins/huaweicloud-core/src"
          # 先落到仓外：提交步骤会 reset --hard 对齐远端后，再把产物拷进仓库
          python scripts/gen_ux_special.py \
            --sut "${{ steps.sut.outputs.version }}（npm）=$SRC" \
            --out "${RUNNER_TEMP}/UX专项.json"

      - name: Render dashboard
        run: python scripts/gen_dashboard.py

      - name: Commit & push dashboard
        # 本仓写入者众多（多 agent 直推 + 其他自动写回），直接 commit+push 极易
        # non-fast-forward 被拒 → 每轮先对齐远端再生成产物，失败即重试。
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          UX_OUT="results/UX专项/UX专项-$(date +%F).json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if [ -f "${RUNNER_TEMP}/UX专项.json" ]; then
              mkdir -p results/UX专项
              cp "${RUNNER_TEMP}/UX专项.json" "$UX_OUT"
            fi
            python scripts/gen_dashboard.py
            git add dashboard.html results/UX专项
            if git diff --cached --quiet; then
              echo "dashboard/UX 专项 无变动，跳过提交"
              exit 0
            fi
            git commit -m "chore: 自动刷新看板 $(date +%Y-%m-%d_%H:%M)"
            if git push origin HEAD:main; then
              echo "推送成功（第 ${attempt} 次尝试）"
              exit 0
            fi
            echo "push 被拒（生成期间远端又前进）→ 第 $((attempt + 1)) 次重试"
            sleep 5
          done
          echo "连续 3 次 push 被拒，放弃" >&2
          exit 1